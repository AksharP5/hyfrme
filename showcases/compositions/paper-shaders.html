      @font-face { font-family: "Apple Color Emoji"; src: local("Apple Color Emoji"); }
      @font-face { font-family: "Segoe UI Emoji"; src: local("Segoe UI Emoji"); }
      @font-face { font-family: "Segoe UI Symbol"; src: local("Segoe UI Symbol"); }
      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #09090b; }
      #hyfrme-showcase-root { position: absolute; inset: 0; width: 1280px; height: 720px; overflow: hidden; }
      #hyfrme-showcase-root, #hyfrme-showcase-root * { text-rendering: auto; }
    </style>
  </head>
  <body>
    <div id="paper-shaders" data-composition-id="paper-shaders" data-start="0" data-duration="32.8" data-fps="30" data-width="1280" data-height="720">
      <div
        id="hyfrme-showcase-root"
        class="clip"
        data-start="0"
        data-duration="32.8"
        data-track-index="0"
        data-layout-allow-overflow
        data-layout-allow-overlap
        data-layout-allow-occlusion
      ></div>
    </div>
    <script src="compositions/paper-shaders.runtime.js"></script>
    <script>
      window.__hyfrmeShowcaseReady.then(() => {
      window.__timelines = window.__timelines || {};
      const clock = { frame: 0 };
      const timeline = gsap.timeline({ paused: true });
      timeline.to(clock, {
        frame: 984,
        duration: 32.8,
        ease: "none",
        onUpdate: () => window.__hyfrmeRenderFrame(
          Math.max(0, Math.min(983, Math.round(clock.frame)))
        ),
      });
      window.__timelines["paper-shaders"] = timeline;
      });
    </script>
  </body>
</html>
