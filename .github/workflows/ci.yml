name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install media verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - run: npm ci
      - run: npm run check
      - run: npm run build
