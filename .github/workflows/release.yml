name: Release CLI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: release-please-manifest.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs['cli--release_created'] == 'true' }}
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ steps.release.outputs['cli--release_created'] == 'true' }}
        with:
          node-version: "24.18.0"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: ${{ steps.release.outputs['cli--release_created'] == 'true' }}
        run: npm ci

      - name: Check catalog and registry
        if: ${{ steps.release.outputs['cli--release_created'] == 'true' }}
        run: npm run check

      - name: Build catalog and downloadable CLI
        if: ${{ steps.release.outputs['cli--release_created'] == 'true' }}
        run: npm run build

      - name: Inspect npm package
        if: ${{ steps.release.outputs['cli--release_created'] == 'true' }}
        env:
          VERSION: ${{ steps.release.outputs['cli--version'] }}
        shell: bash
        run: |
          npm pack ./cli --dry-run --json > /tmp/hyfrme-pack.json
          test "$(jq -r 'length' /tmp/hyfrme-pack.json)" = 1
          test "$(jq -r '.[0].name' /tmp/hyfrme-pack.json)" = "hyfrme"
          test "$(jq -r '.[0].version' /tmp/hyfrme-pack.json)" = "$VERSION"
          test "$(jq -r '.[0].files[] | select(.path == "bin/hyfrme.mjs") | .mode' /tmp/hyfrme-pack.json)" = 493

      - name: Publish to npm
        if: ${{ steps.release.outputs['cli--release_created'] == 'true' }}
        run: npm publish ./cli --access public --provenance --ignore-scripts

      - name: Publish GitHub release
        if: ${{ steps.release.outputs['cli--release_created'] == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs['cli--tag_name'] }}
        run: gh release edit "$TAG_NAME" --draft=false
