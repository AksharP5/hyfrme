<!doctype html>
<html lang="en" data-composition-variables='[]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-SemiBold.woff2") format("woff2"); font-style: normal; font-weight: 600; font-display: block; }




      * { box-sizing: border-box; }
      html, body { width: 432px; height: 768px; margin: 0; overflow: hidden; background: linear-gradient(180deg, #cfe0ec 0%, #a7c6e0 100%); }
      body { --font-geist-sans: "Geist"; font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="telegram-chat-flow" data-start="0" data-duration="12" data-fps="30" data-width="432" data-height="768">
      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="12" data-track-index="0">
        <div id="hyfrme-source-root"></div>
      </div>
    </div>
    <script src="./telegram-chat-flow.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const clock = { frame: 0 };
      const timeline = gsap.timeline({ paused: true });
      timeline.to(clock, {
        frame: 360,
        duration: 12,
        ease: "none",
        onUpdate: () => window.__hyfrmeRenderFrame(Math.max(0, Math.min(359, Math.round(clock.frame)))),
      });
      window.__timelines["telegram-chat-flow"] = timeline;
    </script>
  </body>
</html>
