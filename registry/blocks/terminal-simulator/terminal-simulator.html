<!doctype html>
<html lang="en" data-composition-variables='[{"id":"prompt","type":"string","label":"Prompt","default":"$"},{"id":"title","type":"string","label":"Title","default":"~/projects/remocn"},{"id":"background","type":"color","label":"Background","default":"#0a0a0a"},{"id":"chromeColor","type":"color","label":"Chrome color","default":"#1a1a1a"},{"id":"fontSize","type":"number","label":"Font size","default":18},{"id":"charsPerFrame","type":"number","label":"Chars / frame","default":1},{"id":"chunkSize","type":"number","label":"Chunk size","default":1},{"id":"speed","type":"number","label":"Speed","default":1}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-SemiBold.woff2") format("woff2"); font-style: normal; font-weight: 600; font-display: block; }




      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #050505; }
      body { --font-geist-sans: "Geist"; font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="terminal-simulator" data-start="0" data-duration="8" data-fps="30" data-width="1280" data-height="720">
      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <div id="hyfrme-source-root"></div>
      </div>
    </div>
    <script src="./terminal-simulator.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const clock = { frame: 0 };
      const timeline = gsap.timeline({ paused: true });
      timeline.to(clock, {
        frame: 240,
        duration: 8,
        ease: "none",
        onUpdate: () => window.__hyfrmeRenderFrame(Math.max(0, Math.min(239, Math.round(clock.frame)))),
      });
      window.__timelines["terminal-simulator"] = timeline;
    </script>
  </body>
</html>
