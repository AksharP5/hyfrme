<!doctype html>
<html lang="en" data-composition-variables='[{"id":"selectedIndex","type":"number","label":"","default":1,"min":0,"max":3,"step":1},{"id":"variant","type":"string","label":"Variant","default":"soft","options":["soft","solid"]}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Hyfrme Remocn Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }





      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: oklch(1 0 0); }
      body { --font-geist-sans: "Hyfrme Remocn Geist"; font-family: "Hyfrme Remocn Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Hyfrme Remocn Geist";font-family:"Hyfrme Remocn Geist",sans-serif; background:oklch(1 0 0); }


    </style>
  </head>
  <body>
    <div id="root" data-composition-id="select-menu" data-start="0" data-duration="4.266666666666667" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="4.266666666666667" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{"https://fonts.gstatic.com/s/geist/v5/gyByhwUxId8gMEwcGFU.woff2":"../assets/fonts/Geist-Latin.woff2"}'></div>
      </div>
    </div>
    <script src="./select-menu.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="select-menu"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="select-menu"] [data-hyfrme-clock]', {
        frame: 128,
        duration: 4.266666666666667,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(127, Math.round(clock.frame)))),
      });

      window.__timelines["select-menu"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
