<!doctype html>
<html lang="en" data-composition-variables='[{"id":"from","type":"number","label":"From","default":0},{"id":"to","type":"number","label":"To","default":24813},{"id":"fontSize","type":"number","label":"Font size","default":120},{"id":"color","type":"color","label":"Color","default":"#171717"},{"id":"speed","type":"number","label":"Speed","default":1,"min":1,"max":4,"step":0.25}]'>

    <script>
      window.__timelines = window.__timelines || {};
      const clock = { frame: 0 };
      const timeline = gsap.timeline({ paused: true });
      timeline.to(clock, {

        duration: 3.7333333333333334,
