<!doctype html>
<html lang="en" data-composition-variables='[{"id":"account","type":"string","label":"Account","default":"remocn"},{"id":"accentColor","type":"color","label":"Accent","default":"#db61a2"},{"id":"theme","type":"string","label":"Theme","default":"light","options":["light","dark"]},{"id":"speed","type":"number","label":"Speed","default":1,"min":1,"max":4,"step":0.25}]'>

  </head>
  <body>

      </div>
    </div>
    <script src="./github-sponsors.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="github-sponsors"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="github-sponsors"] [data-hyfrme-clock]', {
        frame: 270,
        duration: 9,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(269, Math.round(clock.frame)))),
      });

      window.__timelines["github-sponsors"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
