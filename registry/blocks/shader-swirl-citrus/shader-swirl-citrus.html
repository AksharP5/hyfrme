<!doctype html>
<html lang="en" data-composition-variables='[{"id":"speed","type":"number","label":"Speed","default":1,"min":0.25,"max":4,"step":0.25},{"id":"bandCount","type":"number","label":"Bands","default":3,"min":1,"max":12,"step":1},{"id":"twist","type":"number","label":"Twist","default":0.25,"min":0,"max":1,"step":0.05},{"id":"softness","type":"number","label":"Softness","default":0.4,"min":0,"max":1,"step":0.05},{"id":"colorBack","type":"color","label":"Background","default":"#fff8e1"}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Hyfrme Remocn Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }






      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: transparent; }
      body { --font-geist-sans: "Hyfrme Remocn Geist"; font-family: "Hyfrme Remocn Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Hyfrme Remocn Geist";font-family:"Hyfrme Remocn Geist",sans-serif; background:transparent; }




    </style>
  </head>
  <body>
    <div id="root" data-composition-id="shader-swirl-citrus" data-start="0" data-duration="5" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{"https://fonts.gstatic.com/s/geist/v5/gyByhwUxId8gMEwcGFU.woff2":"../assets/fonts/Geist-Latin.woff2"}'></div>
      </div>
    </div>
    <script src="./shader-swirl-citrus.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="shader-swirl-citrus"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="shader-swirl-citrus"] [data-hyfrme-clock]', {
        frame: 150,
        duration: 5,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(149, Math.round(clock.frame)))),
      });

      window.__timelines["shader-swirl-citrus"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
