<!doctype html>
<html lang="en" data-composition-variables='[{"id":"durationInFrames","type":"number","label":"Duration","default":18,"min":8,"max":30,"step":1},{"id":"gain","type":"number","label":"Surge","default":1,"min":0,"max":2,"step":0.05},{"id":"afterglow","type":"number","label":"Afterglow","default":1,"min":0,"max":2,"step":0.05},{"id":"phosphor","type":"color","label":"Phosphor","default":"#d8ecff"}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }





      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #050505; }
      body { --font-geist-sans: "Geist"; font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; }
      [data-hyfrme-seek-probe] { position: absolute; width: 1px; height: 1px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="tv-power-off" data-start="0" data-duration="2.066666666666667" data-fps="30" data-width="1280" data-height="720">
      <canvas layoutsubtree hidden data-layout-ignore data-hyfrme-clock></canvas>
      <span data-hyfrme-seek-probe aria-hidden="true"></span>
      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="2.066666666666667" data-track-index="0">
        <div id="hyfrme-source-root" data-layout-ignore data-layout-allow-occlusion data-layout-allow-overlap></div>
      </div>
    </div>
    <script src="./tv-power-off.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const clock = document.querySelector('[data-composition-id="tv-power-off"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="tv-power-off"] [data-hyfrme-clock]', {
        frame: 62,
        duration: 2.066666666666667,
        ease: "none",
        onUpdate: () => window.__hyfrmeRenderFrame(Math.max(0, Math.min(61, Math.round(clock.frame)))),
      });
      timeline.to('[data-composition-id="tv-power-off"] [data-hyfrme-seek-probe]', { x: 120, duration: 2.066666666666667, ease: "none" }, 0);
      window.__timelines["tv-power-off"] = timeline;
    </script>
  </body>
</html>
