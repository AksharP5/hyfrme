<!doctype html>
<html lang="en" data-composition-variables='[{"id":"text","type":"string","label":"Text","default":"Glyph"},{"id":"color","type":"color","label":"Glyph color","default":"#fafafa"},{"id":"guideColor","type":"color","label":"Points","default":"#0d99ff"},{"id":"fontSize","type":"number","label":"Font size","default":200,"min":80,"max":320,"step":2},{"id":"guides","type":"boolean","label":"Guides","default":true},{"id":"keepPoints","type":"boolean","label":"Keep points","default":false},{"id":"speed","type":"number","label":"Speed","default":1,"min":0.25,"max":4,"step":0.25}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Hyfrme Remocn Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }

      @font-face { font-family: "Inter"; src: url("../assets/fonts/Inter-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }




      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #0a0a0a; }
      body { --font-geist-sans: "Hyfrme Remocn Geist"; font-family: "Hyfrme Remocn Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Hyfrme Remocn Geist";font-family:"Hyfrme Remocn Geist",sans-serif; background:#0a0a0a; }





    </style>
  </head>
  <body>
    <div id="root" data-composition-id="glyph-anatomy" data-start="0" data-duration="3.2" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="3.2" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{"https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2":"../assets/fonts/Inter-Latin.woff2","https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuDyYMZg.ttf":"../assets/remocn-additions-2026-09-28/Inter-ExtraBold-v20.ttf","/assets/remocn-additions-2026-09-28/Inter-ExtraBold-v20.ttf":"../assets/remocn-additions-2026-09-28/Inter-ExtraBold-v20.ttf"}'></div>
      </div>
    </div>
    <script src="./glyph-anatomy.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="glyph-anatomy"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="glyph-anatomy"] [data-hyfrme-clock]', {
        frame: 96,
        duration: 3.2,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(95, Math.round(clock.frame)))),
      });

      window.__timelines["glyph-anatomy"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
