<!doctype html>
<html lang="en" data-composition-variables='[{"id":"fromText","type":"string","label":"From text","default":"Executing it?"},{"id":"toText","type":"string","label":"To text","default":"That&#39;s where everyone quits"},{"id":"fontSize","type":"number","label":"Font size","default":72,"min":12,"max":160,"step":1},{"id":"swapAt","type":"number","label":"Swap frame","default":20,"min":10,"max":120,"step":5},{"id":"typeSpeed","type":"number","label":"Frames / char","default":1,"min":1,"max":6,"step":1},{"id":"color","type":"color","label":"Color","default":"#171717"},{"id":"caretColor","type":"color","label":"Caret top","default":"#FF4DAA"},{"id":"caretColorEnd","type":"color","label":"Caret bottom","default":"#8A5CF6"},{"id":"fontWeight","type":"string","label":"Font weight","default":"400","options":["400","500","600","700"]},{"id":"speed","type":"number","label":"Speed","default":1}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }






      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #fdf6f0; }
      body { --font-geist-sans: "Geist"; font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="caret-swap" data-start="0" data-duration="3.3333333333333335" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="3.3333333333333335" data-track-index="0">
        <div id="hyfrme-source-root"></div>
      </div>
    </div>

    <script src="./caret-swap.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const clock = document.querySelector('[data-composition-id="caret-swap"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="caret-swap"] [data-hyfrme-clock]', {
        frame: 100,
        duration: 3.3333333333333335,
        ease: "none",
        onUpdate: () => window.__hyfrmeRenderFrame(Math.max(0, Math.min(99, Math.round(clock.frame)))),
      });

      window.__timelines["caret-swap"] = timeline;
    </script>
  </body>
</html>
