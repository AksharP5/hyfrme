        box-shadow: inset 0 1px 1px #ffffff30;
      }
      .chat-avatar img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .chat-text {
        min-width: 0;
        flex: 1;
      }
      .chat-name {
        font-weight: 600;

      }
      .chat-message {

      .chat-row.is-unread .chat-name {

      }
      .chat-row.is-unread .chat-time {

      .chat-row.is-unread:before {

      .chat-row.is-unread .chat-message {

      .chat-bottom {
        position: absolute;

        border-radius: 10px;

      }

      .chat-name {
        padding-right: 64px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .lift-face .chat-row {
        margin: -1px;
      }
    </style>
  </head>
  <body>
    <div
      id="screen-lift"
      data-composition-id="screen-lift"
      data-width="1280"
      data-height="960"
      data-duration="4"
      data-fps="30"
    >
      <div class="atmosphere"></div>
      <div class="softbox" data-layout-allow-overflow></div>
      <div class="light-source" data-layout-allow-overflow></div>
      <div class="camera">
        <div class="rig" data-layout-allow-overflow>
          <div id="screen-lift-metal"></div>
          <div class="front-rim" data-layout-allow-overflow>
            <div class="inner-bezel"></div>
          </div>
          <div class="screen" data-layout-allow-overflow>
            <div class="chat-screen">
              <div class="chat-status">
                <span data-chat-text="clock"></span>
                <div class="chat-symbols">
                  <svg viewBox="0 0 30 22" fill="#cdd0d8">
                    <rect x="1" y="14" width="5" height="7" rx="1" />
                    <rect x="9" y="10" width="5" height="11" rx="1" />
                    <rect x="17" y="5" width="5" height="16" rx="1" />
                    <rect x="25" y="0" width="5" height="21" rx="1" /></svg
                  ><svg
                    viewBox="0 0 28 23"
                    fill="none"
                    stroke="#cdd0d8"
                    stroke-width="3.5"
                    stroke-linecap="round"
                  >
                    <path
                      d="M2 7Q14-2 26 7M7 12Q14 7 21 12M12 17Q14 15 16 17"
                    />
                  </svg>
                  <div class="chat-battery"></div>
                </div>
              </div>
              <div class="chat-island"><div class="chat-lens"></div></div>
              <div class="chat-nav">
                <div class="chat-brand" data-chat-text="profileText"></div>
                <strong data-chat-text="title"></strong>
                <div class="chat-all">
                  <span data-chat-text="filter"></span
                  ><svg
                    viewBox="0 0 16 16"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                  >
                    <path d="m3 6 5 5 5-5" />
                  </svg>
                </div>
              </div>
              <div class="chat-search">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.4"
                >
                  <circle cx="10" cy="10" r="7" />
                  <path d="m15 15 6 6" /></svg
                ><span data-chat-text="search"></span>
              </div>
              <div class="chat-rows"></div>
              <div class="chat-bottom"></div>
            </div>
            <div class="screen-dim"></div>
            <div class="slot primary-slot"></div>
            <div class="slot secondary-slot"></div>
            <div class="glass"></div>
            <div class="glass-reflection"></div>
          </div>
          <div class="button one" data-layout-allow-overflow></div>
          <div class="button two" data-layout-allow-overflow></div>
          <div class="button three" data-layout-allow-overflow></div>
          <div class="rim-reflection" data-layout-allow-overflow></div>
          <div class="rim-glint"></div>
          <div class="lift-row secondary" data-layout-allow-overflow>
            <div class="lift-edge" data-layout-allow-overflow></div>
            <div class="lift-face" data-layout-allow-overflow></div>
          </div>
          <div class="lift-row primary" data-layout-allow-overflow>
            <div class="lift-edge" data-layout-allow-overflow></div>
            <div class="lift-face" data-layout-allow-overflow></div>
          </div>
        </div>
      </div>
      <div class="vignette"></div>
    </div>
    <script>
      (() => {
        const vars = window.__hyperframes.getVariables();
        const root = document.getElementById("screen-lift");
        const height = Math.max(96, Math.min(150, Number(vars.rowHeight)));
        const selected =
          Math.max(1, Math.min(5, Math.round(Number(vars.focusRow)))) - 1;
        const top = 267 + selected * height;
        const depth = Number(vars.lift);
        const angle = Number(vars.angle);
        for (const [key, value] of Object.entries(vars)) {
          if (key.endsWith("Color")) root.style.setProperty(`--${key}`, value);
        }
        root.style.setProperty("--chat-row-height", `${height}px`);
        for (const element of root.querySelectorAll("[data-chat-text]")) {
          element.textContent = vars[element.dataset.chatText];
        }
        const rows = Array.from({ length: 6 }, (_, index) => {
          const prefix = `chat${index + 1}`;
          const row = document.createElement("div");
          row.className = `chat-row${index === selected ? " is-unread" : ""}`;
          row.dataset.chat = String(index + 1);
          // Perspective boxes overlap; the lifted copies also cross their source rows.
          row.innerHTML =
            '<div class="chat-avatar" data-layout-allow-overlap data-layout-allow-occlusion></div><div class="chat-text"><div class="chat-name" data-layout-allow-overlap data-layout-allow-occlusion></div><div class="chat-message" data-layout-allow-overlap data-layout-allow-occlusion></div></div><div class="chat-time" data-layout-allow-overlap data-layout-allow-occlusion></div>';
          row.style.setProperty("--avatarColor", vars[`${prefix}Color`]);
          const avatar = row.querySelector(".chat-avatar");
          avatar.textContent = String(vars[`${prefix}Name`])
            .trim()
            .split(/\s+/u)
            .slice(0, 2)
            .map((part) => Array.from(part)[0] ?? "")
            .join("")
            .toUpperCase();
          if (vars[`${prefix}Avatar`]) {
            const photo = document.createElement("img");
            photo.src = vars[`${prefix}Avatar`];
            photo.alt = "";
            avatar.append(photo);
          }
          row.querySelector(".chat-name").textContent = vars[`${prefix}Name`];
          row.querySelector(".chat-message").textContent =
            vars[`${prefix}Message`];
          row.querySelector(".chat-time").textContent = vars[`${prefix}Time`];
          return row;
        });
        root.querySelector(".chat-rows").append(...rows);
        for (let i = 0; i < 8; i++) {
          const layer = document.createElement("div");
          layer.className = "body-layer";
          layer.setAttribute("data-layout-allow-overflow", "");
          gsap.set(layer, { z: -18 + i * 2 });
          document.getElementById("screen-lift-metal").append(layer);
        }
        for (const [selector, slotSelector, y, index] of [
          [".primary", ".primary-slot", top, selected],
          [".secondary", ".secondary-slot", top + height, selected + 1],
        ]) {
          const row = document.querySelector(selector),
            face = row.querySelector(".lift-face"),
            edge = row.querySelector(".lift-edge");
          gsap.set(row, { top: 14 + y, height, z: 0.2, autoAlpha: 0 });
          face.append(rows[index].cloneNode(true));
          gsap.set(edge, { z: -2 });
          gsap.set(slotSelector, { top: y, height });
        }
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          ".rig",
          {
            x: 60,
            y: 40,
            rotationX: 24,
            rotationY: -21,
            rotationZ: angle + 3,
            scale: 1.23,
          },
          {
            x: -39,
            y: -31,
            rotationX: 13.5,
            rotationY: -11.5,
            rotationZ: angle - 0.2,
            scale: 1.505,
            duration: 4,
            ease: "power2.inOut",
          },
          0,
        );
        tl.fromTo(
          ".primary",
          { z: 0.2, x: 0, y: 0 },
          {
            z: depth,
            x: -23,
            y: height * 0.05,
            duration: 1.35,
            ease: "power3.inOut",
          },
          1.35,
        );
        tl.fromTo(
          ".secondary",
          { z: 0.2, x: 0, y: 0 },
          {
            z: depth * 0.5,
            x: -12,
            y: -height * 0.12,
            duration: 1.45,
            ease: "power3.inOut",
          },
          1.6,
        );
        tl.to(
          ".primary",
          { autoAlpha: 1, duration: 0.35, ease: "sine.inOut" },
          1.35,
        );
        tl.to(
          ".secondary",
          { autoAlpha: 1, duration: 0.35, ease: "sine.inOut" },
          1.6,
        );
        tl.to(".screen-dim", { opacity: 0.38, duration: 1.2 }, 1.35);
        tl.to(".primary-slot", { opacity: 1, duration: 0.6 }, 1.45);
        tl.to(".secondary-slot", { opacity: 1, duration: 0.6 }, 1.7);
        tl.to(".lift-edge", { opacity: 1, duration: 0.75 }, 1.4);
        tl.to(
          ".primary .lift-face",
          {
            borderColor: "#3b454e",
            boxShadow:
              "0 12px 20px #000d, 0 3px 5px #0009, inset 0 1px 0 #e0d8c52b, -1px 0 0 #44c9ef66, 1px 0 0 #e4914444",
            duration: 1.2,
          },
          1.4,
        );
        tl.to(
          ".secondary .lift-face",
          {
            borderColor: "#303a42",
            "--recede": 0.12,
            boxShadow:
              "0 10px 18px #0009, inset 0 1px 0 #d7dfe615, -1px 0 0 #44c9ef33, 1px 0 0 #e4914422",
            duration: 1.2,
          },
          1.6,
        );
        tl.fromTo(
          ".rim-glint",
          { opacity: 0.15, y: -25 },
          { opacity: 1, y: 25, duration: 2, ease: "sine.inOut" },
          0.6,
        );
        tl.to(
          ".rim-glint",
          { opacity: 0.7, y: 75, duration: 1.4, ease: "sine.inOut" },
          2.6,
        );
        tl.fromTo(
          ".glass-reflection",
          { opacity: 0.2, y: -12 },
          { opacity: 0.85, y: 24, duration: 2, ease: "sine.inOut" },
          0.6,
        );
        tl.to(
          ".glass-reflection",
          { opacity: 0.55, y: 56, duration: 1.4, ease: "sine.inOut" },
          2.6,
        );
        tl.fromTo(
          ".softbox",
          { x: 0, opacity: 0.72 },
          { x: 56, opacity: 0.95, duration: 4, ease: "sine.inOut" },
          0,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["screen-lift"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
