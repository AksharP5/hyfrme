<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Geist;
        src: url("Geist.woff2");
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        position: relative;
        margin: 0;
        width: 600px;
        height: 1260px;
        background: #030405;
        color: #f8f9fb;
        font-family: Geist, Arial, sans-serif;
      }
      .status {
        position: absolute;
        left: 43px;
        right: 38px;
        top: 35px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 24px;
        font-weight: 600;
      }
      .island {
        position: absolute;
        left: 218px;
        top: 24px;
        width: 164px;
        height: 48px;
        background: #141619;
        border-radius: 50px;
        box-shadow: inset 0 1px 1px #ffffff08;
      }
      .lens {
        position: absolute;
        right: 15px;
        top: 14px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          #305479 0,
          #101824 23%,
          #030509 48%,
          #0a0d13 64%,
          #000 67%
        );
        border: 2px solid #0a0a0d;
      }
      .symbols {
        display: flex;
        gap: 11px;
        align-items: center;
      }
      .symbols svg {
        height: 22px;
        width: 28px;
      }
      .battery {
        width: 37px;
        height: 19px;
        border: 2px solid #858790;
        border-radius: 6px;
        padding: 2px;
        position: relative;
      }
      .battery:before {
        content: "";
        display: block;
        height: 100%;
        width: 88%;
        border-radius: 2px;
        background: #dddfe4;
      }
      .battery:after {
        content: "";
        width: 2px;
        height: 7px;
        position: absolute;
        right: -5px;
        top: 4px;
        background: #858790;
        border-radius: 2px;
      }
      .nav {
        position: absolute;
        top: 107px;
        left: 29px;
        right: 29px;
        height: 53px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        width: 43px;
        height: 43px;
        border-radius: 50%;
        background:
          radial-gradient(ellipse at 20% 15%, #a0f4e1, transparent 45%),
          radial-gradient(ellipse at 80% 65%, #28b9c8, transparent 55%),
          linear-gradient(35deg, #123f53, #218c91 50%, #4c8cbd);
        box-shadow: inset 0 0 0 1px #ffffff30;
      }
      .nav strong {
        font-size: 30px;
        letter-spacing: -0.9px;
      }
      .nav .all {
        border: 1px solid #272a31;
        border-radius: 28px;
        font-size: 22px;
        padding: 10px 16px;
        color: #c9cbd1;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .nav .all svg {
        width: 15px;
        height: 15px;
      }
      .search {
        position: absolute;
        left: 26px;
        right: 26px;
        top: 187px;
        height: 64px;
        background: #1b1d22;
        border-radius: 36px;
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: center;
        color: #9b9da6;
        font-size: 27px;
        letter-spacing: -0.4px;
      }
      .search svg {
        width: 24px;
        height: 24px;
      }
      .rows {
        position: absolute;
        top: 267px;
        left: 0;
        width: 600px;
      }
      .row {
        height: 112px;
        width: 600px;
        display: flex;
        align-items: center;
        padding: 0 27px;
        gap: 22px;
        position: relative;
        background: #030405;
      }
      .row:after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 128px;
        right: 25px;
        height: 1px;
        background: #1b1d22;
      }
      .row img {
        width: 79px;
        height: 79px;
        border-radius: 50%;
        object-fit: cover;
      }
      .text {
        min-width: 0;
        flex: 1;
      }
      .name {
        font-weight: 600;
        font-size: 27px;
        letter-spacing: -0.7px;
        line-height: 1.35;
      }
      .message {
        font-size: 25px;
        line-height: 1.45;
        color: #a4a7b0;
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
        letter-spacing: -0.7px;
        padding-top: 4px;
      }
      .time {
        position: absolute;
        right: 27px;
        top: 25px;
        font-size: 19px;
        color: #838795;
      }
      .row:nth-child(2) .name {
        color: #fff;
      }
      .row:nth-child(2) .time {
        color: #6c9eff;
      }
      .row:nth-child(2):before {
        content: "";
        position: absolute;
        right: 29px;
        top: 70px;
        width: 9px;
        height: 9px;
        background: #729cff;
        border-radius: 50%;
      }
      .row:nth-child(2) .message {
        padding-right: 17px;
        color: #bec2cb;
      }
      .bottom {
        position: absolute;
        bottom: 33px;
        left: 185px;
        width: 230px;
        height: 7px;
        border-radius: 10px;
        background: #e6e9ee;
      }
    </style>
  </head>
  <body>
    <div class="status">
      <span>9:41</span>
      <div class="symbols">
        <svg viewBox="0 0 30 22" fill="#cdd0d8">
          <rect x="1" y="14" width="5" height="7" rx="1" />
          <rect x="9" y="10" width="5" height="11" rx="1" />
          <rect x="17" y="5" width="5" height="16" rx="1" />
          <rect x="25" y="0" width="5" height="21" rx="1" /></svg
        ><svg
          viewBox="0 0 28 23"
          fill="none"
          stroke="#cdd0d8"
          stroke-width="3.5"
          stroke-linecap="round"
        >
          <path d="M2 7Q14-2 26 7M7 12Q14 7 21 12M12 17Q14 15 16 17" />
        </svg>
        <div class="battery"></div>
      </div>
    </div>
    <div class="island"><div class="lens"></div></div>
    <div class="nav">
      <div class="brand"></div>
      <strong>Chat</strong>
      <div class="all">
        All<svg
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path d="m3 6 5 5 5-5" />
        </svg>
      </div>
    </div>
    <div class="search">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
      >
        <circle cx="10" cy="10" r="7" />
        <path d="m15 15 6 6" /></svg
      >Search
    </div>
    <div class="rows">
      <div class="row">
        <img src="04.jpg" />
        <div class="text">
          <div class="name">Maya Chen</div>
          <div class="message">Have you tried Hyfrme yet?</div>
        </div>
        <div class="time">1h</div>
      </div>
      <div class="row">
        <img src="02.jpg" />
        <div class="text">
          <div class="name">Alex Rivera</div>
          <div class="message">Made this with Hyfrme.</div>
        </div>
        <div class="time">now</div>
      </div>
      <div class="row">
        <img src="01.jpg" />
        <div class="text">
          <div class="name">Sofia Ellis</div>
          <div class="message">Send me that Hyfrme block</div>
        </div>
        <div class="time">2h</div>
      </div>
      <div class="row">
        <img src="03.jpg" />
        <div class="text">
          <div class="name">James Walker</div>
          <div class="message">The screen lift one is so good.</div>
        </div>
        <div class="time">3h</div>
      </div>
      <div class="row">
        <img src="05.jpg" />
        <div class="text">
          <div class="name">Nora Shah</div>
          <div class="message">Just added it to my project.</div>
        </div>
        <div class="time">4h</div>
      </div>
      <div class="row">
        <img src="06.jpg" />
        <div class="text">
          <div class="name">Leo Martin</div>
          <div class="message">Hyfrme saved me hours.</div>
        </div>
        <div class="time">5h</div>
      </div>
    </div>
    <div class="bottom"></div>
  </body>
</html>
