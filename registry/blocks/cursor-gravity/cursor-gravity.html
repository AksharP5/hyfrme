<!doctype html>
<html lang="en" data-composition-variables='[{"id":"label","type":"string","label":"Button label","default":"Create something"},{"id":"tension","type":"number","label":"Pull tension","default":1,"min":0,"max":1.5,"step":0.1},{"id":"cursorColor","type":"color","label":"Cursor","default":"#fffaf0"},{"id":"color","type":"color","label":"Button","default":"#fffaf0"},{"id":"textColor","type":"color","label":"Button text","default":"#32153c"},{"id":"backgroundColor","type":"color","label":"Background","default":"#a800b7"},{"id":"speed","type":"number","label":"Speed","default":1,"min":0.25,"max":4,"step":0.25}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Hyfrme Remocn Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }





      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: transparent; }
      body { --font-geist-sans: "Hyfrme Remocn Geist"; font-family: "Hyfrme Remocn Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Hyfrme Remocn Geist";font-family:"Hyfrme Remocn Geist",sans-serif; background:transparent; }


    </style>
  </head>
  <body>
    <div id="root" data-composition-id="cursor-gravity" data-start="0" data-duration="6" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{}'></div>
      </div>
    </div>
    <script src="./cursor-gravity.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="cursor-gravity"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="cursor-gravity"] [data-hyfrme-clock]', {
        frame: 180,
        duration: 6,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(179, Math.round(clock.frame)))),
      });

      window.__timelines["cursor-gravity"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
