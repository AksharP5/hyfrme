<!doctype html>
<html lang="en" data-composition-variables='[{"id":"strokeColor","type":"color","label":"Stroke color","default":"#22c55e"},{"id":"strokeWidth","type":"number","label":"Stroke width","default":4,"min":1,"max":16,"step":1},{"id":"gridColor","type":"color","label":"Grid color","default":"#27272a"},{"id":"showDot","type":"boolean","label":"Show leading dot","default":true},{"id":"speed","type":"number","label":"Speed","default":1,"min":0.25,"max":4,"step":0.25}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }






      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #0a0a0a; }
      body { --font-geist-sans: "Geist"; font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Geist";font-family:"Geist",sans-serif; background:#0a0a0a; }


#hyfrme-source-root {
  font-size: 14px;
  line-height: calc(20 / 14);
  font-feature-settings: "cv11", "ss01";
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}
#hyfrme-source-root, #hyfrme-source-root * {
  text-rendering: optimizeLegibility;
}

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="animated-line-chart" data-start="0" data-duration="3" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="3" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{}'></div>
      </div>
    </div>
    <script src="./animated-line-chart.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="animated-line-chart"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="animated-line-chart"] [data-hyfrme-clock]', {
        frame: 90,
        duration: 3,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(89, Math.round(clock.frame)))),
      });

      window.__timelines["animated-line-chart"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
