<!doctype html>
<html lang="en" data-composition-variables='[{"id":"command","type":"string","label":"Command","default":"npx shadcn add @remocn/terminal-cursor-zoom"},{"id":"zoom","type":"number","label":"Zoom","default":2.8,"min":1,"max":4,"step":0.1},{"id":"fontSize","type":"number","label":"Font size","default":20,"min":10,"max":32,"step":1},{"id":"prompt","type":"string","label":"Prompt","default":"$"},{"id":"title","type":"string","label":"Title","default":"~/code/remocn-demo"},{"id":"speed","type":"number","label":"Speed","default":1,"min":0.25,"max":4,"step":0.25}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }




      @font-face { font-family: "Geist Mono"; src: url("../assets/fonts/GeistMono-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }

      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #0B0B0C; }
      body { --font-geist-sans: "Geist"; font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Geist";font-family:"Geist",sans-serif; background:#0B0B0C; }
      #hyfrme-source-root { --font-geist-mono: "Geist Mono"; }

#hyfrme-source-root {
  font-size: 14px;
  line-height: calc(20 / 14);
  font-feature-settings: "cv11", "ss01";
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}
#hyfrme-source-root, #hyfrme-source-root * {
  text-rendering: optimizeLegibility;
}

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="terminal-cursor-zoom" data-start="0" data-duration="3" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="3" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{}'></div>
      </div>
    </div>
    <script src="./terminal-cursor-zoom.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="terminal-cursor-zoom"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="terminal-cursor-zoom"] [data-hyfrme-clock]', {
        frame: 90,
        duration: 3,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(89, Math.round(clock.frame)))),
      });

      window.__timelines["terminal-cursor-zoom"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
