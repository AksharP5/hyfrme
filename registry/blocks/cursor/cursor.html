<!doctype html>
<html lang="en" data-composition-variables='[{"id":"variant","type":"string","label":"Variant","default":"arrow","options":["arrow","pointer"]},{"id":"size","type":"number","label":"Size","default":28,"min":16,"max":64,"step":2},{"id":"rippleColor","type":"color","label":"Ripple","default":"#171717"}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }






      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: oklch(1 0 0); }
      body { --font-geist-sans: "Geist"; font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Geist";font-family:"Geist",sans-serif; background:oklch(1 0 0); }


#hyfrme-source-root {
  font-size: 14px;
  line-height: calc(20 / 14);
  font-feature-settings: "cv11", "ss01";
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}
#hyfrme-source-root, #hyfrme-source-root * {
  text-rendering: optimizeLegibility;
}

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="cursor" data-start="0" data-duration="4.666666666666667" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="4.666666666666667" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{}'></div>
      </div>
    </div>
    <script src="./cursor.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="cursor"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="cursor"] [data-hyfrme-clock]', {
        frame: 140,
        duration: 4.666666666666667,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(139, Math.round(clock.frame)))),
      });

      window.__timelines["cursor"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
