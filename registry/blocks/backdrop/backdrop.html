<!doctype html>
<html lang="en" data-composition-variables='[{"id":"fillType","type":"string","label":"Fill type","default":"gradient","options":["color","gradient","image"]},{"id":"color","type":"color","label":"Color","default":"#6366f1"},{"id":"gradient","type":"string","label":"Gradient (CSS)","default":"linear-gradient(135deg, #6366f1 0%, #a855f7 100%)"},{"id":"image","type":"string","label":"Image URL","default":"/hero.png"},{"id":"padding","type":"number","label":"Padding","default":4,"min":0,"max":12,"step":0.5},{"id":"radius","type":"number","label":"Radius","default":1,"min":0,"max":4,"step":0.25},{"id":"shadow","type":"string","label":"Shadow","default":"0 20px 60px rgba(0,0,0,0.4)"}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }






      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #ffffff; }
      body { --font-geist-sans: "Geist"; font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Geist";font-family:"Geist",sans-serif; background:#ffffff; }


#hyfrme-source-root {
  font-size: 14px;
  line-height: calc(20 / 14);
  font-feature-settings: "cv11", "ss01";
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}
#hyfrme-source-root, #hyfrme-source-root * {
  text-rendering: optimizeLegibility;
}

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="backdrop" data-start="0" data-duration="5" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{"/hero.png":"../assets/remocn-preview/hero.png","/assets/remocn-preview/hero.png":"../assets/remocn-preview/hero.png"}'></div>
      </div>
    </div>
    <script src="./backdrop.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="backdrop"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="backdrop"] [data-hyfrme-clock]', {
        frame: 150,
        duration: 5,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(149, Math.round(clock.frame)))),
      });

      window.__timelines["backdrop"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
