<!doctype html>
<html lang="en" data-composition-variables='[{"id":"filename","type":"string","label":"Filename","default":"invoices.tsx"},{"id":"theme","type":"string","label":"Theme","default":"dark","options":["dark","light"]},{"id":"accentColor","type":"color","label":"Accent","default":"#0ea5e9"},{"id":"morphDuration","type":"number","label":"Morph frames","default":36,"min":12,"max":90,"step":1},{"id":"fontSize","type":"number","label":"Font size","default":20,"min":12,"max":32,"step":1},{"id":"highlight","type":"boolean","label":"Highlight changes","default":true},{"id":"lineNumbers","type":"boolean","label":"Line numbers","default":true},{"id":"windowDots","type":"boolean","label":"Window dots","default":true},{"id":"speed","type":"number","label":"Speed","default":1,"min":0.25,"max":4,"step":0.25}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Hyfrme Remocn Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }




      @font-face { font-family: "Geist Mono"; src: url("../assets/fonts/GeistMono-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }

      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #f1eee7; }
      body { --font-geist-sans: "Hyfrme Remocn Geist"; font-family: "Hyfrme Remocn Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Hyfrme Remocn Geist";font-family:"Hyfrme Remocn Geist",sans-serif; background:#f1eee7; }
      #hyfrme-source-root { --font-geist-mono: "Geist Mono"; }

      #hyfrme-source-root, #hyfrme-source-root * { text-rendering: auto; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="code-morph" data-start="0" data-duration="4.6" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="4.6" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{"https://fonts.gstatic.com/s/geistmono/v5/or3nQ6H-1_WfwkMZI_qYFrcdmg.woff2":"../assets/fonts/GeistMono-Latin.woff2"}'></div>
      </div>
    </div>
    <script src="./code-morph.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="code-morph"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="code-morph"] [data-hyfrme-clock]', {
        frame: 138,
        duration: 4.6,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(137, Math.round(clock.frame)))),
      });

      window.__timelines["code-morph"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
