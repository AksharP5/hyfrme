<!doctype html>
<html lang="en" data-composition-variables='[{"id":"prefix","type":"string","label":"Fixed text","default":"Looking for"},{"id":"text","type":"string","label":"Words separated by |","default":"leads | customers | subscribers | appointments | demos | quotes | registrants | trials | conversions"},{"id":"suffix","type":"string","label":"Word suffix","default":"?"},{"id":"fontSize","type":"number","label":"Font size","default":60,"min":16,"max":160,"step":1},{"id":"interval","type":"number","label":"Initial frames per word","default":12,"min":6,"max":60,"step":1},{"id":"acceleration","type":"number","label":"Interval multiplier","default":0.9,"min":0.5,"max":1,"step":0.01},{"id":"transitionFrames","type":"number","label":"Roll duration","default":6,"min":1,"max":20,"step":1},{"id":"color","type":"color","label":"Color","default":"#f5f5f5"}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Hyfrme Remocn Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }





      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #000000; }
      body { --font-geist-sans: "Hyfrme Remocn Geist"; font-family: "Hyfrme Remocn Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Hyfrme Remocn Geist";font-family:"Hyfrme Remocn Geist",sans-serif; background:#000000; }
      #hyfrme-source-root, #hyfrme-source-root * { text-rendering: auto; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="inline-word-roll" data-start="0" data-duration="3.5" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="3.5" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{}'></div>
      </div>
    </div>
    <script src="./inline-word-roll.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="inline-word-roll"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="inline-word-roll"] [data-hyfrme-clock]', {
        frame: 105,
        duration: 3.5,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(104, Math.round(clock.frame)))),
      });

      window.__timelines["inline-word-roll"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
