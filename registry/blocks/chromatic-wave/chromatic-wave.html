<!doctype html>
<html lang="en" data-composition-variables='[{"id":"headline","type":"string","label":"Headline","default":"MUSIC"},{"id":"kicker","type":"string","label":"Kicker","default":"APPLES"},{"id":"fill","type":"color","label":"Fill","default":"#ffffff"},{"id":"waveHeight","type":"number","label":"Wave height","default":28,"min":0,"max":40,"step":1},{"id":"maxDisplacementPx","type":"number","label":"Displacement (px)","default":39,"min":0,"max":60,"step":1},{"id":"turbulentAmount","type":"number","label":"Turbulence","default":130,"min":0,"max":200,"step":2}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Hyfrme Remocn Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }





      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: transparent; }
      body { --font-geist-sans: "Hyfrme Remocn Geist"; font-family: "Hyfrme Remocn Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Hyfrme Remocn Geist";font-family:"Hyfrme Remocn Geist",sans-serif; background:transparent; }


    </style>
  </head>
  <body>
    <div id="root" data-composition-id="chromatic-wave" data-start="0" data-duration="3.3333333333333335" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="3.3333333333333335" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{}'></div>
      </div>
    </div>
    <script src="./chromatic-wave.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="chromatic-wave"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="chromatic-wave"] [data-hyfrme-clock]', {
        frame: 100,
        duration: 3.3333333333333335,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(99, Math.round(clock.frame)))),
      });

      window.__timelines["chromatic-wave"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
