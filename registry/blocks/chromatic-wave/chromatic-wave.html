<!doctype html>
<html lang="en" data-composition-variables='[{"id":"headline","type":"string","label":"Headline","default":"MUSIC"},{"id":"kicker","type":"string","label":"Kicker","default":"APPLES"},{"id":"fill","type":"color","label":"Fill","default":"#ffffff"},{"id":"waveHeight","type":"number","label":"Wave height","default":28,"min":0,"max":40,"step":1},{"id":"maxDisplacementPx","type":"number","label":"Displacement (px)","default":39,"min":0,"max":60,"step":1},{"id":"turbulentAmount","type":"number","label":"Turbulence","default":130,"min":0,"max":200,"step":2}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-SemiBold.woff2") format("woff2"); font-style: normal; font-weight: 600; font-display: block; }





      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #ffffff; }
      body { --font-geist-sans: "Geist"; font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; }
      [data-hyfrme-seek-probe] { position: absolute; width: 1px; height: 1px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="chromatic-wave" data-start="0" data-duration="3.3333333333333335" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>
      <span data-hyfrme-seek-probe aria-hidden="true"></span>
      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="3.3333333333333335" data-track-index="0">
        <div id="hyfrme-source-root" data-layout-allow-overlap></div>
      </div>
    </div>
    <script src="./chromatic-wave.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const clock = document.querySelector('[data-composition-id="chromatic-wave"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="chromatic-wave"] [data-hyfrme-clock]', {
        frame: 100,
        duration: 3.3333333333333335,
        ease: "none",
        onUpdate: () => window.__hyfrmeRenderFrame(Math.max(0, Math.min(99, Math.round(clock.frame)))),
      });
      timeline.to('[data-composition-id="chromatic-wave"] [data-hyfrme-seek-probe]', { x: 120, duration: 3.3333333333333335, ease: "none" }, 0);
      window.__timelines["chromatic-wave"] = timeline;
    </script>
  </body>
</html>
