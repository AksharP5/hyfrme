<!doctype html>
<html lang="en" data-composition-variables='[{"id":"text","type":"string","label":"Text","default":"Repeat"},{"id":"mode","type":"string","label":"Mode","default":"tunnel","options":["tunnel","spiral","fan"]},{"id":"color","type":"color","label":"Word color","default":"#111111"},{"id":"accent","type":"color","label":"Last copy","default":"#fafafa"},{"id":"copies","type":"number","label":"Copies","default":12,"min":2,"max":24,"step":1},{"id":"fontSize","type":"number","label":"Font size","default":110,"min":40,"max":240,"step":2},{"id":"fontWeight","type":"number","label":"Weight","default":800,"min":100,"max":900,"step":50},{"id":"outline","type":"boolean","label":"Outline copies","default":true},{"id":"speed","type":"number","label":"Speed","default":1,"min":0.25,"max":4,"step":0.25}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Hyfrme Remocn Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }

      @font-face { font-family: "Inter"; src: url("../assets/fonts/Inter-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }




      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #ff4d1a; }
      body { --font-geist-sans: "Hyfrme Remocn Geist"; font-family: "Hyfrme Remocn Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Hyfrme Remocn Geist";font-family:"Hyfrme Remocn Geist",sans-serif; background:#ff4d1a; }




    </style>
  </head>
  <body>
    <div id="root" data-composition-id="type-repeater" data-start="0" data-duration="3.3333333333333335" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="3.3333333333333335" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{"https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2":"../assets/fonts/Inter-Latin.woff2"}'></div>
      </div>
    </div>
    <script src="./type-repeater.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="type-repeater"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="type-repeater"] [data-hyfrme-clock]', {
        frame: 100,
        duration: 3.3333333333333335,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(99, Math.round(clock.frame)))),
      });

      window.__timelines["type-repeater"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
