<!doctype html>
<html lang="en" data-composition-variables='[{"id":"pipeColor","type":"color","label":"Pipe color","default":"#1f1f23"},{"id":"pulseColor","type":"color","label":"Pulse color","default":"#22d3ee"},{"id":"pulseLength","type":"number","label":"Pulse length","default":60},{"id":"pulseDuration","type":"number","label":"Pulse duration","default":36},{"id":"nodeColor","type":"color","label":"Node color","default":"#0a0a0a"},{"id":"textColor","type":"color","label":"Text color","default":"#fafafa"},{"id":"speed","type":"number","label":"Speed","default":1}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-SemiBold.woff2") format("woff2"); font-style: normal; font-weight: 600; font-display: block; }




      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #050505; }
      body { --font-geist-sans: "Geist"; font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="data-flow-pipes" data-start="0" data-duration="6" data-fps="30" data-width="1280" data-height="720">
      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <div id="hyfrme-source-root"></div>
      </div>
    </div>
    <script src="./data-flow-pipes.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const clock = { frame: 0 };
      const timeline = gsap.timeline({ paused: true });
      timeline.to(clock, {
        frame: 180,
        duration: 6,
        ease: "none",
        onUpdate: () => window.__hyfrmeRenderFrame(Math.max(0, Math.min(179, Math.round(clock.frame)))),
      });
      window.__timelines["data-flow-pipes"] = timeline;
    </script>
  </body>
</html>
