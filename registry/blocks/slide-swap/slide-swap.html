<!doctype html>
<html lang="en" data-composition-variables='[{"id":"axis","type":"string","label":"Axis","default":"x","options":["x","y"]},{"id":"inDistance","type":"number","label":"Enter distance","default":0.28,"min":0.05,"max":0.8,"step":0.01},{"id":"outDistance","type":"number","label":"Exit distance","default":0.1,"min":0,"max":0.5,"step":0.01},{"id":"slideFrames","type":"number","label":"Enter window","default":30,"min":12,"max":60,"step":1}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-SemiBold.woff2") format("woff2"); font-style: normal; font-weight: 600; font-display: block; }





      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #141318; }
      body { --font-geist-sans: "Geist"; font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="slide-swap" data-start="0" data-duration="7" data-fps="30" data-width="1280" data-height="720">
      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="7" data-track-index="0">
        <div id="hyfrme-source-root"></div>
      </div>
    </div>
    <script src="./slide-swap.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const clock = { frame: 0 };
      const timeline = gsap.timeline({ paused: true });
      timeline.to(clock, {
        frame: 210,
        duration: 7,
        ease: "none",
        onUpdate: () => window.__hyfrmeRenderFrame(Math.max(0, Math.min(209, Math.round(clock.frame)))),
      });
      window.__timelines["slide-swap"] = timeline;
    </script>
  </body>
</html>
