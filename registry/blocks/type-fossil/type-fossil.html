<!doctype html>
<html lang="en" data-composition-variables='[{"id":"text","type":"string","label":"Final word","default":"Form"},{"id":"drafts","type":"string","label":"Drafts (separate with |)","default":"Idea | Maybe | Try | Almost | Again | Closer"},{"id":"layers","type":"number","label":"Contour layers","default":16,"min":4,"max":24,"step":1},{"id":"depth","type":"number","label":"Slice depth","default":100,"min":50,"max":150,"step":5},{"id":"fontSize","type":"number","label":"Font size","default":220,"min":24,"max":300,"step":1},{"id":"fontWeight","type":"string","label":"Font weight","default":"600","options":["400","500","600","700"]},{"id":"color","type":"color","label":"Ink","default":"#302b26"},{"id":"accentColor","type":"color","label":"Contours","default":"#a800b7"},{"id":"backgroundColor","type":"color","label":"Background","default":"#eeeae2"},{"id":"speed","type":"number","label":"Speed","default":1,"min":0.25,"max":4,"step":0.25}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Hyfrme Remocn Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }





      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: transparent; }
      body { --font-geist-sans: "Hyfrme Remocn Geist"; font-family: "Hyfrme Remocn Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Hyfrme Remocn Geist";font-family:"Hyfrme Remocn Geist",sans-serif; background:transparent; }


    </style>
  </head>
  <body>
    <div id="root" data-composition-id="type-fossil" data-start="0" data-duration="6.933333333333334" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="6.933333333333334" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{}'></div>
      </div>
    </div>
    <script src="./type-fossil.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="type-fossil"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="type-fossil"] [data-hyfrme-clock]', {
        frame: 208,
        duration: 6.933333333333334,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(207, Math.round(clock.frame)))),
      });

      window.__timelines["type-fossil"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
