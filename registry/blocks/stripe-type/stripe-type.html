<!doctype html>
<html lang="en" data-composition-variables='[{"id":"text","type":"string","label":"Text","default":"Launch"},{"id":"color","type":"color","label":"Text color","default":"#fafafa"},{"id":"settle","type":"string","label":"Settle","default":"striped","options":["striped","solid"]},{"id":"fontSize","type":"number","label":"Font size","default":180,"min":60,"max":320,"step":2},{"id":"fontWeight","type":"number","label":"Weight","default":800,"min":100,"max":900,"step":50},{"id":"stripes","type":"number","label":"Stripes","default":8,"min":2,"max":16,"step":1},{"id":"gap","type":"number","label":"Gap","default":0.35,"min":0,"max":0.8,"step":0.05},{"id":"hold","type":"number","label":"Hold","default":30,"min":0,"max":120,"step":5},{"id":"exit","type":"boolean","label":"Exit","default":true},{"id":"speed","type":"number","label":"Speed","default":1,"min":0.25,"max":4,"step":0.25}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Hyfrme Remocn Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }

      @font-face { font-family: "Inter"; src: url("../assets/fonts/Inter-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }



      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #2b3bff; }
      body { --font-geist-sans: "Hyfrme Remocn Geist"; font-family: "Hyfrme Remocn Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Hyfrme Remocn Geist";font-family:"Hyfrme Remocn Geist",sans-serif; background:#2b3bff; }



    </style>
  </head>
  <body>
    <div id="root" data-composition-id="stripe-type" data-start="0" data-duration="3.3333333333333335" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="3.3333333333333335" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{}'></div>
      </div>
    </div>
    <script src="./stripe-type.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="stripe-type"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="stripe-type"] [data-hyfrme-clock]', {
        frame: 100,
        duration: 3.3333333333333335,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(99, Math.round(clock.frame)))),
      });

      window.__timelines["stripe-type"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
