<!doctype html>
<html lang="en" data-composition-variables='[{"id":"at","type":"number","label":"Crumple starts","default":6,"min":0,"max":24,"step":3},{"id":"crumpleSteps","type":"number","label":"Crush poses","default":4,"min":2,"max":8,"step":1},{"id":"tossSteps","type":"number","label":"Flight poses","default":5,"min":2,"max":10,"step":1},{"id":"direction","type":"number","label":"Throw angle","default":-35,"min":-180,"max":180,"step":5},{"id":"distance","type":"number","label":"Arc scale","default":440,"min":200,"max":1600,"step":20},{"id":"spin","type":"number","label":"Tumble","default":220,"min":0,"max":720,"step":10},{"id":"segments","type":"number","label":"Paper segments","default":9,"min":5,"max":14,"step":1},{"id":"layers","type":"number","label":"Fold layers","default":2,"min":1,"max":3,"step":1},{"id":"randomness","type":"number","label":"Fold randomness","default":0.6,"min":0,"max":1,"step":0.05},{"id":"crushTo","type":"number","label":"Wad size","default":0.34,"min":0.15,"max":0.7,"step":0.01},{"id":"seed","type":"string","label":"Seed","default":"toss"},{"id":"step","type":"number","label":"Frames / pose","default":3,"min":1,"max":6,"step":1},{"id":"speed","type":"number","label":"Speed","default":1,"min":0.25,"max":4,"step":0.25}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }






      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #f1eee7; }
      body { --font-geist-sans: "Geist"; font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Geist";font-family:"Geist",sans-serif; background:#f1eee7; }


#hyfrme-source-root {
  font-size: 14px;
  line-height: calc(20 / 14);
  font-feature-settings: "cv11", "ss01";
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}
#hyfrme-source-root, #hyfrme-source-root * {
  text-rendering: optimizeLegibility;
}

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="crumple-toss" data-start="0" data-duration="3" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="3" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{}'></div>
      </div>
    </div>
    <script src="./crumple-toss.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="crumple-toss"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="crumple-toss"] [data-hyfrme-clock]', {
        frame: 90,
        duration: 3,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(89, Math.round(clock.frame)))),
      });

      window.__timelines["crumple-toss"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
