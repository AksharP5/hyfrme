<!doctype html>
<html lang="en" data-composition-variables='[{"id":"tiles","type":"number","label":"Tiles across","default":10,"min":4,"max":24,"step":1},{"id":"weight","type":"number","label":"Stroke weight","default":0.2,"min":0.04,"max":0.34,"step":0.01},{"id":"passes","type":"number","label":"Passes","default":2,"min":0,"max":4,"step":1},{"id":"waveMode","type":"string","label":"Wave","default":"radial","options":["radial","diagonal","random"]},{"id":"resolve","type":"string","label":"Resolve to","default":"rings","options":["rings","field","silhouette"]},{"id":"variant","type":"string","label":"Variant","default":"stroke","options":["stroke","filled"]},{"id":"color","type":"color","label":"Line color","default":"#ffffff"},{"id":"secondaryColor","type":"color","label":"Alternate tiles","default":"#ffffff"},{"id":"seed","type":"number","label":"Seed","default":1,"min":1,"max":9007199254740991,"step":1},{"id":"loop","type":"boolean","label":"Loop","default":false},{"id":"speed","type":"number","label":"Speed","default":1,"min":0.25,"max":4,"step":0.25}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Hyfrme Remocn Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }





      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #002fa7; }
      body { --font-geist-sans: "Hyfrme Remocn Geist"; font-family: "Hyfrme Remocn Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Hyfrme Remocn Geist";font-family:"Hyfrme Remocn Geist",sans-serif; background:#002fa7; }



    </style>
  </head>
  <body>
    <div id="root" data-composition-id="truchet-flip" data-start="0" data-duration="4" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{}'></div>
      </div>
    </div>
    <script src="./truchet-flip.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="truchet-flip"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="truchet-flip"] [data-hyfrme-clock]', {
        frame: 120,
        duration: 4,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(119, Math.round(clock.frame)))),
      });

      window.__timelines["truchet-flip"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
