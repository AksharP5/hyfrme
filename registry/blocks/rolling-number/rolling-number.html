<!doctype html>
<html lang="en" data-composition-variables='[{"id":"from","type":"number","label":"From","default":0,"min":0,"max":9007199254740991,"step":1},{"id":"to","type":"number","label":"To","default":24813,"min":0,"max":9007199254740991,"step":1},{"id":"fontSize","type":"number","label":"Font size","default":120,"min":24,"max":280,"step":4},{"id":"color","type":"color","label":"Color","default":"#171717"},{"id":"speed","type":"number","label":"Speed","default":1,"min":1,"max":4,"step":0.25}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }
      @font-face { font-family: "JetBrains Mono"; src: url("../assets/fonts/JetBrainsMono-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 800; font-display: block; }





      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #ffffff; }
      body { --font-geist-sans: "Geist"; font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Geist";font-family:"Geist",sans-serif; background:#ffffff; }


#hyfrme-source-root {
  font-size: 14px;
  line-height: calc(20 / 14);
  font-feature-settings: "cv11", "ss01";
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}
#hyfrme-source-root, #hyfrme-source-root * {
  text-rendering: optimizeLegibility;
}

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="rolling-number" data-start="0" data-duration="5" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{}'></div>
      </div>
    </div>
    <script src="./rolling-number.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="rolling-number"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="rolling-number"] [data-hyfrme-clock]', {
        frame: 150,
        duration: 5,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(149, Math.round(clock.frame)))),
      });

      window.__timelines["rolling-number"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
