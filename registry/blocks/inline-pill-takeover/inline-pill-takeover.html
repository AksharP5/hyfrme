<!doctype html>
<html lang="en" data-composition-variables='[{"id":"before","type":"string","label":"Text before pill","default":"powering 20%"},{"id":"insert","type":"string","label":"Pill text","default":"Start building"},{"id":"after","type":"string","label":"Text after pill","default":"of the Internet."},{"id":"fontSize","type":"number","label":"Font size","default":52,"min":24,"max":120,"step":1},{"id":"pillWidth","type":"number","label":"Expanded pill width","default":260,"min":100,"max":600,"step":5},{"id":"expandFrames","type":"number","label":"Width reveal frames","default":12,"min":6,"max":45,"step":1},{"id":"pillRevealHeightScale","type":"number","label":"Initial reveal height scale","default":0.35,"min":0.05,"max":1,"step":0.05},{"id":"pillGrowAt","type":"number","label":"Pill growth start frame","default":12,"min":6,"max":30,"step":1},{"id":"pillGrowFrames","type":"number","label":"Pill growth frames","default":24,"min":6,"max":36,"step":1},{"id":"pillGrowWidthScale","type":"number","label":"Final pill width scale","default":1.08,"min":1,"max":1.3,"step":0.01},{"id":"pillGrowHeightScale","type":"number","label":"Final pill height scale","default":1.16,"min":1,"max":1.5,"step":0.01},{"id":"outerExitFrames","type":"number","label":"Outer text exit frames","default":18,"min":6,"max":30,"step":1},{"id":"takeoverAt","type":"number","label":"Camera move start frame","default":12,"min":12,"max":40,"step":1},{"id":"takeoverScale","type":"number","label":"Final takeover scale","default":2.15,"min":1,"max":4,"step":0.05},{"id":"blur","type":"number","label":"Outer text blur","default":12,"min":0,"max":30,"step":1},{"id":"color","type":"color","label":"Outer text color","default":"#fff3df"},{"id":"pillColor","type":"color","label":"Pill color","default":"#fffaf0"},{"id":"pillTextColor","type":"color","label":"Pill text color","default":"#1c1210"},{"id":"fontWeight","type":"string","label":"Font weight","default":"400","options":["400","500","600","700"]},{"id":"speed","type":"number","label":"Speed","default":1}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }






      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: radial-gradient(circle at 50% 108%, #ffd77a 0%, #ff6840 31%, #f13d21 78%); }
      body { --font-geist-sans: "Geist"; font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="inline-pill-takeover" data-start="0" data-duration="1.5" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="1.5" data-track-index="0">
        <div id="hyfrme-source-root"></div>
      </div>
    </div>

    <script src="./inline-pill-takeover.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const clock = document.querySelector('[data-composition-id="inline-pill-takeover"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="inline-pill-takeover"] [data-hyfrme-clock]', {
        frame: 45,
        duration: 1.5,
        ease: "none",
        onUpdate: () => window.__hyfrmeRenderFrame(Math.max(0, Math.min(44, Math.round(clock.frame)))),
      });

      window.__timelines["inline-pill-takeover"] = timeline;
    </script>
  </body>
</html>
