<!doctype html>
<html lang="en" data-composition-variables='[{"id":"enterScale","type":"number","label":"Enter scale","default":1.24,"min":1,"max":1.8,"step":0.02},{"id":"enterStagger","type":"number","label":"Stagger","default":3,"min":0,"max":10,"step":0.5},{"id":"exitScale","type":"number","label":"Exit scale","default":0.84,"min":0.5,"max":1,"step":0.02},{"id":"exitFrames","type":"number","label":"Exit frames","default":6,"min":2,"max":24,"step":1}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }






      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #141318; }
      body { --font-geist-sans: "Geist"; font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Geist";font-family:"Geist",sans-serif; background:#141318; }




    </style>
  </head>
  <body>
    <div id="root" data-composition-id="spring-settle" data-start="0" data-duration="7.1" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="7.1" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{}'></div>
      </div>
    </div>
    <script src="./spring-settle.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="spring-settle"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="spring-settle"] [data-hyfrme-clock]', {
        frame: 213,
        duration: 7.1,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(212, Math.round(clock.frame)))),
      });

      window.__timelines["spring-settle"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
