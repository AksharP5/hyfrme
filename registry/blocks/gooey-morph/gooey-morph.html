<!doctype html>
<html lang="en" data-composition-variables='[{"id":"word","type":"string","label":"Word","default":"HELLO"},{"id":"fill","type":"color","label":"Fill","default":"#f2f2f2"},{"id":"fontFamily","type":"string","label":"Font family","default":"&#39;Bodoni Moda&#39;, Georgia, serif"},{"id":"blurRadius","type":"number","label":"Goo blur radius","default":6,"min":0,"max":20,"step":1},{"id":"displaceAmount","type":"number","label":"Displace amount","default":20,"min":0,"max":80,"step":1},{"id":"barTravelFrames","type":"number","label":"Bar travel (frames)","default":30,"min":10,"max":60,"step":1}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Hyfrme Remocn Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }





      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #141318; }
      body { --font-geist-sans: "Hyfrme Remocn Geist"; font-family: "Hyfrme Remocn Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Hyfrme Remocn Geist";font-family:"Hyfrme Remocn Geist",sans-serif; background:#141318; }


    </style>
  </head>
  <body>
    <div id="root" data-composition-id="gooey-morph" data-start="0" data-duration="4" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{}'></div>
      </div>
    </div>
    <script src="./gooey-morph.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="gooey-morph"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="gooey-morph"] [data-hyfrme-clock]', {
        frame: 120,
        duration: 4,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(119, Math.round(clock.frame)))),
      });

      window.__timelines["gooey-morph"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
