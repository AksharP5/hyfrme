<!doctype html>
<html lang="en" data-composition-variables='[{"id":"upperText","type":"string","label":"Upper line","default":"REMOCN"},{"id":"lowerText","type":"string","label":"Lower line","default":"BEST"},{"id":"fill","type":"color","label":"Fill","default":"#f2f2f2"},{"id":"upperFontFamily","type":"string","label":"Upper font","default":"Impact, &#39;Arial Narrow&#39;, sans-serif"},{"id":"lowerFontFamily","type":"string","label":"Lower font","default":"Impact, &#39;Arial Narrow&#39;, sans-serif"},{"id":"lineGap","type":"number","label":"Line gap","default":50,"min":0,"max":120,"step":2}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Hyfrme Remocn Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }





      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #141318; }
      body { --font-geist-sans: "Hyfrme Remocn Geist"; font-family: "Hyfrme Remocn Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Hyfrme Remocn Geist";font-family:"Hyfrme Remocn Geist",sans-serif; background:#141318; }


    </style>
  </head>
  <body>
    <div id="root" data-composition-id="perspective-squeeze" data-start="0" data-duration="7.5" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="7.5" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{}'></div>
      </div>
    </div>
    <script src="./perspective-squeeze.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="perspective-squeeze"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="perspective-squeeze"] [data-hyfrme-clock]', {
        frame: 225,
        duration: 7.5,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(224, Math.round(clock.frame)))),
      });

      window.__timelines["perspective-squeeze"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
