<!doctype html>
<html lang="en" data-composition-variables='[{"id":"text","type":"string","label":"Text","default":"MOTION"},{"id":"separator","type":"string","label":"Separator","default":"·"},{"id":"color","type":"color","label":"Text color","default":"#fafafa"},{"id":"accent","type":"color","label":"Band color","default":"#ff4d1a"},{"id":"accentText","type":"color","label":"Band text","default":"#111111"},{"id":"fontSize","type":"number","label":"Row height","default":64,"min":24,"max":180,"step":2},{"id":"seed","type":"number","label":"Seed","default":7,"min":0,"max":99,"step":1},{"id":"speed","type":"number","label":"Speed","default":1,"min":0.25,"max":4,"step":0.25}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Hyfrme Remocn Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }

      @font-face { font-family: "Inter"; src: url("../assets/fonts/Inter-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }
      @font-face { font-family: "Anton"; src: url("../assets/fonts/Anton-Latin.woff2") format("woff2"); font-style: normal; font-weight: 400; font-display: block; }



      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #2b3bff; }
      body { --font-geist-sans: "Hyfrme Remocn Geist"; font-family: "Hyfrme Remocn Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Hyfrme Remocn Geist";font-family:"Hyfrme Remocn Geist",sans-serif; background:#2b3bff; }


      #hyfrme-source-root, #hyfrme-source-root * { text-rendering: auto; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="type-wall" data-start="0" data-duration="5" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{"https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2":"../assets/fonts/Inter-Latin.woff2","https://fonts.gstatic.com/s/anton/v27/1Ptgg87LROyAm3Kz-C8.woff2":"../assets/fonts/Anton-Latin.woff2"}'></div>
      </div>
    </div>
    <script src="./type-wall.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="type-wall"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="type-wall"] [data-hyfrme-clock]', {
        frame: 150,
        duration: 5,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(149, Math.round(clock.frame)))),
      });

      window.__timelines["type-wall"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
