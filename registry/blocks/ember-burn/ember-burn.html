<!doctype html>
<html lang="en" data-composition-variables='[{"id":"patches","type":"number","label":"Patches","default":5,"min":2,"max":16,"step":1},{"id":"edgeSoftness","type":"number","label":"Edge softness","default":0.07,"min":0.005,"max":0.2,"step":0.005},{"id":"contentBias","type":"number","label":"Eats bright first","default":0.6,"min":0,"max":1,"step":0.05},{"id":"heat","type":"number","label":"Heat distortion","default":0.5,"min":0,"max":1.5,"step":0.05},{"id":"glowColor","type":"color","label":"Glow","default":"#ff7a2f"},{"id":"emberAmount","type":"number","label":"Embers","default":0.5,"min":0,"max":1,"step":0.05}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }




      @font-face { font-family: "Geist Mono"; src: url("../assets/fonts/GeistMono-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }

      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #0a0a0a; }
      body { --font-geist-sans: "Geist"; font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Geist";font-family:"Geist",sans-serif; background:#0a0a0a; }
      #hyfrme-source-root { --font-geist-mono: "Geist Mono"; }



#hyfrme-source-root {
  font-size: 14px;
  line-height: calc(20 / 14);
  font-feature-settings: "cv11", "ss01";
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}
#hyfrme-source-root, #hyfrme-source-root * {
  text-rendering: optimizeLegibility;
}
      [data-hyfrme-seek-probe] { position: absolute; width: 1px; height: 1px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="ember-burn" data-start="0" data-duration="2.6666666666666665" data-fps="30" data-width="1280" data-height="720">
      <canvas layoutsubtree hidden data-layout-ignore data-hyfrme-clock></canvas>
      <span data-hyfrme-seek-probe aria-hidden="true"></span>
      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="2.6666666666666665" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{}' data-layout-ignore data-layout-allow-occlusion data-layout-allow-overlap></div>
      </div>
    </div>
    <script src="./ember-burn.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="ember-burn"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="ember-burn"] [data-hyfrme-clock]', {
        frame: 80,
        duration: 2.6666666666666665,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(79, Math.round(clock.frame)))),
      });
      timeline.to('[data-composition-id="ember-burn"] [data-hyfrme-seek-probe]', { x: 120, duration: 2.6666666666666665, ease: "none" }, 0);
      window.__timelines["ember-burn"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
