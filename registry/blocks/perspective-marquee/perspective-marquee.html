<!doctype html>
<html lang="en" data-composition-variables='[{"id":"fontSize","type":"number","label":"Font size","default":84},{"id":"color","type":"color","label":"Color","default":"#fafafa"},{"id":"fontWeight","type":"string","label":"Font weight","default":"700"},{"id":"pixelsPerFrame","type":"number","label":"Pixels / frame","default":2},{"id":"rotateY","type":"number","label":"Rotate Y (deg)","default":-28},{"id":"rotateX","type":"number","label":"Rotate X (deg)","default":8},{"id":"perspective","type":"number","label":"Perspective","default":1200},{"id":"fadeColor","type":"color","label":"Fade color","default":"#050505"},{"id":"speed","type":"number","label":"Speed","default":1}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-SemiBold.woff2") format("woff2"); font-style: normal; font-weight: 600; font-display: block; }




      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #050505; }
      body { --font-geist-sans: "Geist"; font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="perspective-marquee" data-start="0" data-duration="8" data-fps="30" data-width="1280" data-height="720">
      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <div id="hyfrme-source-root"></div>
      </div>
    </div>
    <script src="./perspective-marquee.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const clock = { frame: 0 };
      const timeline = gsap.timeline({ paused: true });
      timeline.to(clock, {
        frame: 240,
        duration: 8,
        ease: "none",
        onUpdate: () => window.__hyfrmeRenderFrame(Math.max(0, Math.min(239, Math.round(clock.frame)))),
      });
      window.__timelines["perspective-marquee"] = timeline;
    </script>
  </body>
</html>
