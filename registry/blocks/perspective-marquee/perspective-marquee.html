<!doctype html>
<html lang="en" data-composition-variables='[{"id":"fontSize","type":"number","label":"Font size","default":84,"min":24,"max":200,"step":2},{"id":"color","type":"color","label":"Color","default":"#fafafa"},{"id":"fontWeight","type":"string","label":"Font weight","default":"700"},{"id":"pixelsPerFrame","type":"number","label":"Pixels / frame","default":2,"min":0.25,"max":10,"step":0.25},{"id":"rotateY","type":"number","label":"Rotate Y (deg)","default":-28,"min":-60,"max":60,"step":1},{"id":"rotateX","type":"number","label":"Rotate X (deg)","default":8,"min":-30,"max":30,"step":1},{"id":"perspective","type":"number","label":"Perspective","default":1200,"min":400,"max":3000,"step":50},{"id":"fadeColor","type":"color","label":"Fade color","default":"#050505"},{"id":"speed","type":"number","label":"Speed","default":1}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }






      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #050505; }
      body { --font-geist-sans: "Geist"; font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Geist";font-family:"Geist",sans-serif; background:#050505; }




#hyfrme-source-root {
  font-size: 14px;
  line-height: calc(20 / 14);
  font-feature-settings: "cv11", "ss01";
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}
#hyfrme-source-root, #hyfrme-source-root * {
  text-rendering: optimizeLegibility;
}

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="perspective-marquee" data-start="0" data-duration="8" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{}'></div>
      </div>
    </div>
    <script src="./perspective-marquee.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="perspective-marquee"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="perspective-marquee"] [data-hyfrme-clock]', {
        frame: 240,
        duration: 8,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(239, Math.round(clock.frame)))),
      });

      window.__timelines["perspective-marquee"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
