<!doctype html>
<html lang="en" data-composition-variables='[{"id":"repo","type":"string","label":"Repository","default":"Remocn/remocn"},{"id":"totalStars","type":"number","label":"Total stars","default":24813,"min":0,"max":500000,"step":1},{"id":"orientation","type":"string","label":"Orientation","default":"horizontal","options":["horizontal","vertical"]},{"id":"accentColor","type":"color","label":"Accent","default":"#ffbb00"},{"id":"theme","type":"string","label":"Theme","default":"light","options":["light","dark"]},{"id":"speed","type":"number","label":"Speed","default":1,"min":1,"max":4,"step":0.25}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-SemiBold.woff2") format("woff2"); font-style: normal; font-weight: 600; font-display: block; }
      @font-face { font-family: "JetBrains Mono"; src: url("../assets/fonts/JetBrainsMono-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 800; font-display: block; }

      @font-face { font-family: "Manrope"; src: url("../assets/fonts/Manrope-Latin.woff2") format("woff2"); font-style: normal; font-weight: 200 800; font-display: block; }
      @font-face { font-family: "Geist Mono"; src: url("../assets/fonts/GeistMono-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }

      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #ffffff; }
      body { --font-geist-sans: "Geist"; font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Geist";font-family:"Geist",sans-serif; background:#ffffff; }
      #hyfrme-source-root, #hyfrme-source-root * { text-rendering: auto; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="github-stars" data-start="0" data-duration="4" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{"/assets/social/avatars/u1.png":"../assets/social/avatars/u1.png","/assets/social/avatars/u2.png":"../assets/social/avatars/u2.png","/assets/social/avatars/u3.png":"../assets/social/avatars/u3.png","/assets/social/avatars/u4.png":"../assets/social/avatars/u4.png","/assets/social/avatars/u14.png":"../assets/social/avatars/u14.png","/assets/social/avatars/u18.png":"../assets/social/avatars/u18.png","/assets/social/avatars/u25.png":"../assets/social/avatars/u25.png","/assets/social/avatars/u26.png":"../assets/social/avatars/u26.png","/assets/social/avatars/u28.png":"../assets/social/avatars/u28.png","/assets/social/avatars/u30.png":"../assets/social/avatars/u30.png","/assets/social/avatars/u31.png":"../assets/social/avatars/u31.png","/assets/social/avatars/u21.png":"../assets/social/avatars/u21.png"}'></div>
      </div>
    </div>
    <script src="./github-stars.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="github-stars"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="github-stars"] [data-hyfrme-clock]', {
        frame: 120,
        duration: 4,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(119, Math.round(clock.frame)))),
      });

      window.__timelines["github-stars"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
