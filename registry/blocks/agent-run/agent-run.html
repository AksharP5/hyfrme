<!doctype html>
<html lang="en" data-composition-variables='[{"id":"theme","type":"string","label":"Theme","default":"light","options":["light","dark"]},{"id":"accentColor","type":"color","label":"Accent","default":"#2563eb"},{"id":"compression","type":"number","label":"Compression","default":3,"min":1,"max":8,"step":0.5},{"id":"seed","type":"number","label":"Seed","default":1,"min":1,"max":99,"step":1},{"id":"speed","type":"number","label":"Speed","default":1,"min":0.25,"max":4,"step":0.25}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Hyfrme Remocn Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }





      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #ececea; }
      body { --font-geist-sans: "Hyfrme Remocn Geist"; font-family: "Hyfrme Remocn Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Hyfrme Remocn Geist";font-family:"Hyfrme Remocn Geist",sans-serif; background:#ececea; }



    </style>
  </head>
  <body>
    <div id="root" data-composition-id="agent-run" data-start="0" data-duration="11.833333333333334" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="11.833333333333334" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{}'></div>
      </div>
    </div>
    <script src="./agent-run.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="agent-run"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="agent-run"] [data-hyfrme-clock]', {
        frame: 355,
        duration: 11.833333333333334,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(354, Math.round(clock.frame)))),
      });

      window.__timelines["agent-run"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
