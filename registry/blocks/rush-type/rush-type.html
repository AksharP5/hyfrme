<!doctype html>
<html lang="en" data-composition-variables='[{"id":"phrase","type":"string","label":"Phrase","default":"gone before you look"},{"id":"fontSize","type":"number","label":"Resting size","default":68,"min":32,"max":140,"step":2},{"id":"fontWeight","type":"string","label":"Font weight","default":"400","options":["400","500","600","700"]},{"id":"color","type":"color","label":"Text color","default":"#ffffff"},{"id":"backgroundColor","type":"color","label":"Background","default":"#000000"},{"id":"verticalStretch","type":"number","label":"Vertical stretch","default":7,"min":3,"max":12,"step":0.25},{"id":"chromaticSpread","type":"number","label":"Chromatic spread","default":1,"min":0,"max":2,"step":0.05},{"id":"restDuration","type":"number","label":"Rest duration","default":12,"min":6,"max":30,"step":1},{"id":"peakHoldDuration","type":"number","label":"Peak hold","default":3,"min":0,"max":15,"step":1},{"id":"speed","type":"number","label":"Speed","default":1,"min":0.25,"max":4,"step":0.25}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Hyfrme Remocn Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }





      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #000000; }
      body { --font-geist-sans: "Hyfrme Remocn Geist"; font-family: "Hyfrme Remocn Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Hyfrme Remocn Geist";font-family:"Hyfrme Remocn Geist",sans-serif; background:#000000; }


    </style>
  </head>
  <body>
    <div id="root" data-composition-id="rush-type" data-start="0" data-duration="3.466666666666667" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="3.466666666666667" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{}'></div>
      </div>
    </div>
    <script src="./rush-type.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="rush-type"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="rush-type"] [data-hyfrme-clock]', {
        frame: 104,
        duration: 3.466666666666667,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(103, Math.round(clock.frame)))),
      });

      window.__timelines["rush-type"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
