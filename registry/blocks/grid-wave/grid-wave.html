<!doctype html>
<html lang="en" data-composition-variables='[{"id":"tileSize","type":"number","label":"Tile size","default":90,"min":30,"max":260,"step":10},{"id":"waveWidth","type":"number","label":"Wave width","default":0.16,"min":0.04,"max":0.5,"step":0.02},{"id":"lift","type":"number","label":"Lift","default":2,"min":0,"max":4,"step":0.1},{"id":"gap","type":"number","label":"Gap","default":0.12,"min":0,"max":0.45,"step":0.01},{"id":"tint","type":"color","label":"Tint","default":"#8fb4ff"},{"id":"direction","type":"string","label":"Direction","default":"ripple","options":["ripple","left","right","up","down"]}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }





      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #0a0a0a; }
      body { --font-geist-sans: "Geist"; font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; }
      [data-hyfrme-seek-probe] { position: absolute; width: 1px; height: 1px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="grid-wave" data-start="0" data-duration="2.8" data-fps="30" data-width="1280" data-height="720">
      <canvas layoutsubtree hidden data-layout-ignore data-hyfrme-clock></canvas>
      <span data-hyfrme-seek-probe aria-hidden="true"></span>
      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="2.8" data-track-index="0">
        <div id="hyfrme-source-root" data-layout-ignore data-layout-allow-occlusion data-layout-allow-overlap></div>
      </div>
    </div>
    <script src="./grid-wave.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const clock = document.querySelector('[data-composition-id="grid-wave"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="grid-wave"] [data-hyfrme-clock]', {
        frame: 84,
        duration: 2.8,
        ease: "none",
        onUpdate: () => window.__hyfrmeRenderFrame(Math.max(0, Math.min(83, Math.round(clock.frame)))),
      });
      timeline.to('[data-composition-id="grid-wave"] [data-hyfrme-seek-probe]', { x: 120, duration: 2.8, ease: "none" }, 0);
      window.__timelines["grid-wave"] = timeline;
    </script>
  </body>
</html>
