<!DOCTYPE html>

  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <style>

      #soft-blur-in-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #soft-blur-in-text { color: #171717; font: 600 72px "Geist", -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: -0.05em; }
      .soft-blur-in-character { display: inline-block; white-space: pre; backface-visibility: hidden; transform-origin: 50% 55%; will-change: transform, opacity, filter; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-n2ly" id="root" data-composition-id="soft-blur-in" data-start="0" data-duration="2" data-fps="30" data-width="1280" data-height="720">
      <div data-hf-id="hf-1sp9" id="soft-blur-in-stage" class="clip" data-start="0" data-duration="2" data-track-index="0">
        <span data-hf-id="hf-k1qe" id="soft-blur-in-text" aria-label="Think different."></span>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      gsap.registerPlugin(CustomEase);
      const variables = window.__hyperframes.getVariables();
      const text = String(variables.text);
      const blur = Number(variables.blur);
      const speed = Math.max(0.01, Number(variables.speed));
      const textElement = document.getElementById("soft-blur-in-text");
      textElement.textContent = "";
      textElement.setAttribute("aria-label", text);
      textElement.style.fontSize = `${Number(variables.fontSize)}px`;
      textElement.style.color = String(variables.color);
      textElement.style.fontWeight = String(Number(variables.fontWeight));
      const characters = Array.from(text, (character) => {
        const span = document.createElement("span");
        span.className = "soft-blur-in-character";
        span.textContent = character;
        span.setAttribute("aria-hidden", "true");
        textElement.appendChild(span);
        return span;
      });
      const ease = CustomEase.create("remocn-soft-blur-in", "M0,0 C0.22,1 0.36,1 1,1");
      const timeline = gsap.timeline({ paused: true });
      characters.forEach((character, index) => {
        timeline.fromTo(
          character,
          { opacity: 0, y: 16, filter: `blur(${blur}px)` },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 27 / (30 * speed), ease },
          index / (30 * speed),
        );
      });
      window.__timelines["soft-blur-in"] = timeline;
    </script>
  </body>
</html>
