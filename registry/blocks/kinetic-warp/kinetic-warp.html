<!doctype html>
<html lang="en" data-composition-variables='[{"id":"text","type":"string","label":"Text","default":"REM\nOCN"},{"id":"textColor","type":"color","label":"Color","default":"#FFFFFF"},{"id":"fontFamily","type":"string","label":"Font family","default":"Passion One"},{"id":"fontUrl","type":"string","label":"Font URL","default":"/assets/fonts/PassionOne.css"},{"id":"fontWeight","type":"string","label":"Font weight","default":"700","options":["400","500","600","700"]},{"id":"fontSize","type":"number","label":"Font size","default":107.1,"min":40,"max":200,"step":0.1},{"id":"layerScale","type":"number","label":"Layer scale (%)","default":480,"min":100,"max":800,"step":10},{"id":"keyframeStride","type":"number","label":"Keyframe stride","default":20,"min":5,"max":40,"step":1}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-SemiBold.woff2") format("woff2"); font-style: normal; font-weight: 600; font-display: block; }





      @font-face { font-family: "Passion One"; src: url("../assets/fonts/PassionOne-400.ttf") format("truetype"); font-style: normal; font-weight: 400; font-display: block; }
      @font-face { font-family: "Passion One"; src: url("../assets/fonts/PassionOne-700.ttf") format("truetype"); font-style: normal; font-weight: 700; font-display: block; }
      @font-face { font-family: "Passion One"; src: url("../assets/fonts/PassionOne-900.ttf") format("truetype"); font-style: normal; font-weight: 900; font-display: block; }
      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #141318; }
      body { --font-geist-sans: "Geist"; font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; }
      [data-hyfrme-seek-probe] { position: absolute; width: 1px; height: 1px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="kinetic-warp" data-start="0" data-duration="4" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>
      <span data-hyfrme-seek-probe aria-hidden="true"></span>
      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div id="hyfrme-source-root"></div>
      </div>
    </div>
    <script src="./kinetic-warp.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const clock = document.querySelector('[data-composition-id="kinetic-warp"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="kinetic-warp"] [data-hyfrme-clock]', {
        frame: 120,
        duration: 4,
        ease: "none",
        onUpdate: () => window.__hyfrmeRenderFrame(Math.max(0, Math.min(119, Math.round(clock.frame)))),
      });
      timeline.to('[data-composition-id="kinetic-warp"] [data-hyfrme-seek-probe]', { x: 120, duration: 4, ease: "none" }, 0);
      window.__timelines["kinetic-warp"] = timeline;
    </script>
  </body>
</html>
