<!doctype html>
<html lang="en" data-composition-variables='[{"id":"title","type":"string","label":"Title","default":"scene.tsx"},{"id":"zoom","type":"number","label":"Zoom","default":2.6,"min":1,"max":4,"step":0.1},{"id":"fontSize","type":"number","label":"Font size","default":18,"min":10,"max":28,"step":1},{"id":"staggerFrames","type":"number","label":"Stagger frames","default":10,"min":1,"max":30,"step":1},{"id":"width","type":"number","label":"Width","default":880,"min":300,"max":1100,"step":10},{"id":"height","type":"number","label":"Height","default":420,"min":200,"max":700,"step":10},{"id":"speed","type":"number","label":"Speed","default":1,"min":0.25,"max":4,"step":0.25}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }




      @font-face { font-family: "Geist Mono"; src: url("../assets/fonts/GeistMono-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }

      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #ffffff; }
      body { --font-geist-sans: "Geist"; font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Geist";font-family:"Geist",sans-serif; background:#ffffff; }
      #hyfrme-source-root { --font-geist-mono: "Geist Mono"; }

#hyfrme-source-root {
  font-size: 14px;
  line-height: calc(20 / 14);
  font-feature-settings: "cv11", "ss01";
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}
#hyfrme-source-root, #hyfrme-source-root * {
  text-rendering: optimizeLegibility;
}

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="glass-code-walk" data-start="0" data-duration="5" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{"/bg.jpg":"../assets/remocn-preview/bg.jpg","/assets/remocn-preview/bg.jpg":"../assets/remocn-preview/bg.jpg"}'></div>
      </div>
    </div>
    <script src="./glass-code-walk.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="glass-code-walk"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="glass-code-walk"] [data-hyfrme-clock]', {
        frame: 150,
        duration: 5,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(149, Math.round(clock.frame)))),
      });

      window.__timelines["glass-code-walk"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
