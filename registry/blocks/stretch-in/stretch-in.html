<!doctype html>
<html lang="en" data-composition-variables='[{"id":"text","type":"string","label":"Text","default":"REMOCN"},{"id":"fill","type":"color","label":"Fill","default":"#ffffff"},{"id":"fontSize","type":"number","label":"Font size","default":510,"min":100,"max":700,"step":10},{"id":"entryStagger","type":"number","label":"Letter stagger","default":3,"min":0,"max":12,"step":1},{"id":"travelFrames","type":"number","label":"Travel (frames)","default":33,"min":4,"max":40,"step":1},{"id":"vertexLagFrames","type":"number","label":"Smear lag (frames)","default":3.5,"min":0,"max":8,"step":0.5}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-SemiBold.woff2") format("woff2"); font-style: normal; font-weight: 600; font-display: block; }






      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #141318; }
      body { --font-geist-sans: "Geist"; font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; }
      [data-hyfrme-seek-probe] { position: absolute; width: 1px; height: 1px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="stretch-in" data-start="0" data-duration="2" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>
      <span data-hyfrme-seek-probe aria-hidden="true"></span>
      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="2" data-track-index="0">
        <div id="hyfrme-source-root"></div>
      </div>
    </div>
    <script>window.__hyfrmeAssetProps = {"fontUrl":"../assets/fonts/Anton-Latin.ttf"};</script>
    <script src="./stretch-in.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const clock = document.querySelector('[data-composition-id="stretch-in"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="stretch-in"] [data-hyfrme-clock]', {
        frame: 60,
        duration: 2,
        ease: "none",
        onUpdate: () => window.__hyfrmeRenderFrame(Math.max(0, Math.min(59, Math.round(clock.frame)))),
      });
      timeline.to('[data-composition-id="stretch-in"] [data-hyfrme-seek-probe]', { x: 120, duration: 2, ease: "none" }, 0);
      window.__timelines["stretch-in"] = timeline;
    </script>
  </body>
</html>
