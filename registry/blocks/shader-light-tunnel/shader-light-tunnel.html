<!doctype html>
<html lang="en" data-composition-variables='[{"id":"speed","type":"number","label":"Speed","default":1,"min":0.25,"max":4,"step":0.25},{"id":"twist","type":"number","label":"Spiral motion","default":0.7,"min":0,"max":2,"step":0.05},{"id":"spirals","type":"number","label":"Spiral count","default":3,"min":1,"max":6,"step":1},{"id":"glow","type":"number","label":"Light exposure","default":1,"min":0,"max":3,"step":0.05},{"id":"depth","type":"number","label":"Perspective","default":1,"min":0.5,"max":2,"step":0.05},{"id":"timeOffset","type":"number","label":"Start time","default":0,"min":0,"max":60,"step":0.1}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Hyfrme Remocn Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }





      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #05050a; }
      body { --font-geist-sans: "Hyfrme Remocn Geist"; font-family: "Hyfrme Remocn Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Hyfrme Remocn Geist";font-family:"Hyfrme Remocn Geist",sans-serif; background:#05050a; }


    </style>
  </head>
  <body>
    <div id="root" data-composition-id="shader-light-tunnel" data-start="0" data-duration="3" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="3" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{}'></div>
      </div>
    </div>
    <script src="./shader-light-tunnel.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="shader-light-tunnel"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="shader-light-tunnel"] [data-hyfrme-clock]', {
        frame: 90,
        duration: 3,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(89, Math.round(clock.frame)))),
      });

      window.__timelines["shader-light-tunnel"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
