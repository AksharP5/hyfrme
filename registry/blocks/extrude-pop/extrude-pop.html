<!doctype html>
<html lang="en" data-composition-variables='[{"id":"letter","type":"string","label":"Text","default":"WIN"},{"id":"bodyColor","type":"color","label":"Body color","default":"#e8192b"},{"id":"faceColor","type":"color","label":"Face color","default":"#ffffff"},{"id":"minimaxRadius","type":"number","label":"Extrude radius","default":80,"min":0,"max":200,"step":5},{"id":"extrudeAngleDeg","type":"number","label":"Extrude angle","default":-58.6,"min":-180,"max":180,"step":1},{"id":"extrudeEndFrame","type":"number","label":"Extrude ends (frame)","default":48,"min":10,"max":90,"step":1}]'>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Hyfrme Remocn Geist"; src: url("../assets/fonts/Geist-Latin.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }





      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #141318; }
      body { --font-geist-sans: "Hyfrme Remocn Geist"; font-family: "Hyfrme Remocn Geist", -apple-system, BlinkMacSystemFont, sans-serif; }
      #hyfrme-source-root { position: absolute; inset: 0; --font-geist-sans:"Hyfrme Remocn Geist";font-family:"Hyfrme Remocn Geist",sans-serif; background:#141318; }


    </style>
  </head>
  <body>
    <div id="root" data-composition-id="extrude-pop" data-start="0" data-duration="3" data-fps="30" data-width="1280" data-height="720">
      <span hidden data-layout-ignore data-hyfrme-clock></span>

      <div id="hyfrme-source-stage" class="clip" data-start="0" data-duration="3" data-track-index="0">
        <div id="hyfrme-source-root" data-hyfrme-assets='{}'></div>
      </div>
    </div>
    <script src="./extrude-pop.runtime.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const renderFrame = window.__hyfrmeRenderFrame;
      window.__hyfrmeReady.then(() => {
      const clock = document.querySelector('[data-composition-id="extrude-pop"] [data-hyfrme-clock]');
      clock.frame = 0;
      const timeline = gsap.timeline({ paused: true });
      timeline.to('[data-composition-id="extrude-pop"] [data-hyfrme-clock]', {
        frame: 90,
        duration: 3,
        ease: "none",
        onUpdate: () => renderFrame(Math.max(0, Math.min(89, Math.round(clock.frame)))),
      });

      window.__timelines["extrude-pop"] = timeline;
      window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
